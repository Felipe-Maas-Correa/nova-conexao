# Nginx — site Nova Conexão
# Copie para /etc/nginx/sites-available/nova-conexao (ver tutorial).
#
# Está só em HTTP de propósito: depois, o comando
#   sudo certbot --nginx -d novaconexao.net.br -d www.novaconexao.net.br
# cria o certificado HTTPS e ajusta este arquivo sozinho.

server {
    listen 80;
    listen [::]:80;
    server_name novaconexao.net.br www.novaconexao.net.br;

    # Versão atual do site (o script atualizar.sh troca este link)
    root /var/www/nova-conexao/site/atual;
    index index.html;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Fotos e vídeos de ALTA QUALIDADE. O que estiver em
    # /var/www/nova-conexao/midias/img/ tem prioridade sobre as versões leves
    # que vêm dentro do site: basta colocar o arquivo com o MESMO NOME.
    location /img/ {
        root /var/www/nova-conexao/midias;
        try_files $uri @img_do_site;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location @img_do_site {
        root /var/www/nova-conexao/site/atual;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Arquivos com hash no nome (nunca mudam de conteúdo): cache de 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API (formulário de contato) — processo Node na porta 4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # O HTML nunca pode ficar em cache: ele aponta para arquivos com hash que
    # mudam a cada versão. Velho, o site abriria sem estilo.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
